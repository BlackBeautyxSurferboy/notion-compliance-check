[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notion-compliance-check"
version = "0.1.0"
description = "MCP server that audits a Notion workspace for IT and company compliance risks (DSGVO, public exposure, stale data, PII)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Reinbach" }]
keywords = ["notion", "mcp", "compliance", "gdpr", "dsgvo", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp[cli]>=1.27.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "python-dotenv>=1.0.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
  "respx>=0.21.0",
]

[project.scripts]
ncc = "ncc.cli:main"
ncc-mcp = "ncc.server:run"
ncc-webhook = "ncc.webhook:run"

[project.urls]
Homepage = "https://github.com/alexreinbach/notion-compliance-check"
Issues = "https://github.com/alexreinbach/notion-compliance-check/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ncc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",   # line too long — handled by formatter
  "RUF002", # ambiguous unicode in docstrings — we use proper en/em-dashes deliberately
  "RUF003", # ambiguous unicode in comments — same
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
